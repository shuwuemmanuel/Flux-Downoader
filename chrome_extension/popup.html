<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Flux Downloader</title>
  <style>
    body {
      width: 280px;
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f5f5f7;
      margin: 0;
      padding: 14px;
      color: #1d1d1f;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      margin-bottom: 12px;
      padding: 6px 8px;
      border-radius: 8px;
      background: white;
      border: 1px solid #d2d2d7;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ccc; }
    .dot.on { background: #34c759; }
    .dot.off { background: #ff3b30; }
    label.row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 10px;
    }
    input[type=url] {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid #c7c7cc;
      margin-bottom: 8px;
    }
    button {
      width: 100%;
      padding: 7px 0;
      border: none;
      border-radius: 8px;
      background: linear-gradient(#34aaff, #007AFF);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1e90ff; }
  </style>
</head>
<body>
  <h1>⚡ Flux Downloader</h1>
  <div class="status">
    <div id="dot" class="dot"></div>
    <span id="statusText">Checking connection…</span>
  </div>

  <label class="row">
    Intercept browser downloads
    <input type="checkbox" id="interceptToggle">
  </label>

  <label class="row">
    Show download icons on videos
    <input type="checkbox" id="iconsToggle">
  </label>

  <input type="url" id="urlInput" placeholder="Paste a URL to send…">
  <button id="sendBtn">Send to Flux Downloader</button>

  <script src="popup.js"></script>
</body>
</html>
